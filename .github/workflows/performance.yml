name: Performance regression checks

on:
  push:
  pull_request:

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra shacl
      - name: Lint performance implementation
        run: uv run ruff check src/tclkg/qcn_generator2.py src/tclkg/launcher.py src/tclkg/oracle_cache.py src/tclkg/run_experiments.py scripts/benchmark_performance.py tests/test_performance.py
      - name: Check formatting
        run: uv run ruff format --check src/tclkg/qcn_generator2.py src/tclkg/launcher.py src/tclkg/oracle_cache.py src/tclkg/run_experiments.py scripts/benchmark_performance.py tests/test_performance.py
      - name: Type check performance implementation
        run: uv run pyright src/tclkg/qcn_generator2.py src/tclkg/launcher.py src/tclkg/oracle_cache.py src/tclkg/run_experiments.py scripts/benchmark_performance.py tests/test_performance.py
      - name: Verify frozen semantic cases
        run: uv run pytest tests/test_performance.py tests/test_ground_truth_unit.py tests/test_two_stage_propagation.py
